name: telemetry

mgmt:
  network: clab
  ipv4-subnet: 172.80.80.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:23.3.1

  nodes:
    spine1:
      kind: nokia_srlinux
      type: ixrd3
      mgmt-ipv4: 172.80.80.11
      startup-config: configs/spine1.cfg
    leaf1:
      kind: nokia_srlinux
      type: ixrd2
      mgmt-ipv4: 172.80.80.12
      startup-config: configs/leaf1.cfg
    leaf2:
      kind: nokia_srlinux
      type: ixrd2
      mgmt-ipv4: 172.80.80.13
      startup-config: configs/leaf2.cfg
    client1:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.100.1/24 dev eth1
        - ip link set eth1 mtu 9000
    client2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
        - ip addr add 192.168.100.2/24 dev eth1
        - ip link set eth1 mtu 9000

  links:
    - endpoints: ["spine1:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine1:e1-2", "leaf2:e1-1"]
    - endpoints: ["leaf1:e1-10", "client1:eth1"]
    - endpoints: ["leaf2:e1-10", "client2:eth1"]
